<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Selected Work</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#090909;
    color:white;
    font-family:Inter,sans-serif;
    padding:60px 20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    font-size:48px;
    margin-bottom:40px;
}

.video-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
    gap:28px;
}

.player{
    background:#111;
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    overflow:hidden;
    transition:.3s;
}

.player:hover{
    transform:translateY(-4px);
    border-color:rgba(255,255,255,.2);
}

.player iframe{
    width:100%;
    aspect-ratio:16/9;
    border:0;
    display:block;
}

.info{
    padding:18px;
}

.info h3{
    font-size:18px;
    margin-bottom:6px;
}

.info p{
    color:#888;
    font-size:14px;
}
</style>

</head>
<body>

<div class="container">

<h1>Selected Work</h1>

<div class="video-grid">

<div class="player">
<iframe
src="https://www.youtube.com/embed/qKpWNnkiqx8"
allowfullscreen>
</iframe>
<div class="info">
<h3>SaaS Explainer</h3>
<p>Feature Walkthrough</p>
</div>
</div>

<div class="player">
<iframe
src="https://www.youtube.com/embed/3y29_d1MtZo"
allowfullscreen>
</iframe>
<div class="info">
<h3>Product Promo</h3>
<p>App Demo</p>
</div>
</div>

<div class="player">
<iframe
src="https://www.youtube.com/embed/OW__BZUAtvw"
allowfullscreen>
</iframe>
<div class="info">
<h3>Motion Graphics</h3>
<p>UI Animation</p>
</div>
</div>

<div class="player">
<iframe
src="https://www.youtube.com/embed/GBILZ57KRdk"
allowfullscreen>
</iframe>
<div class="info">
<h3>Ad Creative</h3>
<p>SaaS Promo</p>
</div>
</div>

</div>

</div>

</body>
</html>
