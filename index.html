<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

<style>
body{
    margin:0;
    background:#080808;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    font-family:sans-serif;
}

.player{
    width:min(1000px,90vw);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.plyr{
    --plyr-color-main:#ffffff;
    --plyr-video-controls-background:rgba(15,15,15,.7);
    --plyr-menu-background:#111;
    --plyr-menu-color:#fff;
    border-radius:20px;
}

.plyr__control{
    border-radius:999px;
}

.plyr--full-ui input[type=range]{
    color:white;
}
</style>
</head>
<body>

<div class="player">
    <video
        id="player"
        playsinline
        controls
        poster="https://res.cloudinary.com/djn3aak43/video/upload/so_0/New_Project_455_F592CBF_nflpdv.jpg">

        <source
        src="https://res.cloudinary.com/djn3aak43/video/upload/q_auto,f_auto/New_Project_455_F592CBF_nflpdv.mp4"
        type="video/mp4">
    </video>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>
new Plyr('#player', {
    controls: [
        'play-large',
        'play',
        'progress',
        'current-time',
        'mute',
        'volume',
        'fullscreen'
    ]
});
</script>

</body>
</html>
